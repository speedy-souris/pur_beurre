{% extends 'food_selection/base.html' %}
{% load static %}

<title>{{ page_name }}</title>

{% block content %}
    <div class="container-fluid p-5 mt-5 ">
        <div class="row g-0 justify-content-center text-center">
            <h1 class="mt-6">{{ product.name }}</h1>
            <div class="position-relative d-inline-block mt-6">
                <img style="width: 250px; height: 450px;"
                     src="{% static 'food_selection/images/image_product/'|add:product.product_id|add:'.jpg' %}"
                     alt="image produit selectionné" />
            </div>
            <div class="position-relative d-inline-block mt-5">
                <img style="width: 100px; height: 50px;"
                     src="{% static 'food_selection/images/image_nutriscore/'|add:'Nutriscore_'|add:product.nutriscore|add:'.jpg' %}"
                     alt="nutriscore du produit selectionné" />
                <div class="position-relative d-inline-block ms-4"> Repéres Nutritionnels pour 100 g
                    <div> {{ product.nutriments.salt_100g }} </div>
               </div>
            </div>
            <div class="mt-3">
                <a href="{{ product.url }}" target="_blank" class="btn btn-primary">Fiche Produit OpenFoodFacts</a>
            </div>
        </div>
    </div>
{% endblock %}
