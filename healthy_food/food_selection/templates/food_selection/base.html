{% load static %}
<!DOCTYPE html>
<html lang="fr">
<!-- general structure of the site -->
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>{{ page_name }}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="{% static 'food_selection/assets/favicon.ico' %}" />
        <!-- Bootstrap Icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Google fonts-->
        <link href="https://fonts.googleapis.com/css?family=Merriweather+Sans:400,700" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css?family=Merriweather:400,300,300italic,400italic,700,700italic" rel="stylesheet" type="text/css" />
        <!-- SimpleLightbox plugin CSS-->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/SimpleLightbox/2.1.0/simpleLightbox.min.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="{% static 'food_selection/css/styles.css' %}" rel="stylesheet" />
        <link href="{% static 'authentication/css/styles.css' %}" rel="stylesheet" />
    </head>
    <!-- Add the classes : d-flex flex-column min-vh-100 -->
    <body id="page-top" class="bg-global d-flex flex-column min-vh-100">
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-light fixed-top py-3" id="mainNav">
            <div class="container px-4 px-lg-5" style="background-color: white">
                <a class="navbar-brand text-black" href="{% url 'food_selection:home' %}"><img src="{% static 'food_selection/assets/favicon.ico' %}" alt="logo startup pur beurre"> Pur beurre</a>
                <button class="navbar-toggler navbar-toggler-right" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto my-2 my-lg-0">
                        <li class="nav-item">
                            <form class="navbar-brand my-3 text-black" action="{% url 'food_selection:found' %}" method="get">
                                {{ search_form }}
                                <input type="submit" value="Chercher">
                            </form>
                        </li>
                        <li class="navbar-brand my-1 nav-item">
                            <!-- If the user is logged in, change the link to the profile; otherwise, change it to the login page. -->
                            <a href="{% if user.is_authenticated %}{% url 'food_selection:profile' %}{% else %}{% url 'authentication:login' %}{% endif %}"
                               class="d-flex align-items-center text-decoration-none">

                                {% if user.is_authenticated %}
                                    <!-- Displays the user name in orange (or text-black) -->
                                    <span class="text-warning me-1" style="font-size: 1rem; font-weight: bold;">
                                        Bonjour,  {{ user.username }}
                                    </span>
                                    <img src="{% static 'food_selection/assets/img/portfolio/icon-profile.png' %}" alt="logo profil connecté">
                                {% else %}
                                    <!-- Optional: Add “Sign in” for visitors -->
                                    <span class="text-muted me-2" style="font-size: 0.9rem;">Se connecter</span>
                                    <img src="{% static 'food_selection/assets/img/portfolio/marque-de-croix.png' %}" alt="logo profil déconnecté">
                                {% endif %}
                            </a>
                        </li>
                        <li class="navbar-brand my-2 nav-item"><a href="{% url 'food_selection:saved-list' %}"><img src="{% static 'food_selection/assets/img/portfolio/carrot-29691.png' %}" alt="logo carrot"></a></li>
                        <li class="navbar-brand my-2 nav-item"><a href="{% url 'authentication:logout' %}"><img src="{% static 'food_selection/assets/img/portfolio/téléchargement.png' %}" alt="logo deconnection"></a></li>
                    </ul>
                </div>
            </div>
        </nav>
         <!-- The content must be wrapped in a div that will “grow” (flex-grow-1). -->
        <div class="flex-grow-1">
            {% block content %}{% endblock %}
        </div>
        <!-- Footer-->
        <footer class="bg-light py-5 mt-auto"> <!-- mt-auto also helps -->
            <div class="container px-4 px-lg-5">
                <div class="small text-center text-muted">
                    <a href="{% url 'food_selection:disclaimer' %}"> Mentions légales</a> |
                    <a href="{% url 'food_selection:contact-us' %}"> Contact</a>
                </div>
            </div>
        </footer>
        <!-- SimpleLightbox plugin JS-->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/SimpleLightbox/2.1.0/simpleLightbox.min.js"></script>
        <!-- Core theme JS-->
        <script src="{% static 'food_selection/js/scripts.js' %}"></script>
        <!-- * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *-->
        <!-- * *                               SB Forms JS                               * *-->
        <!-- * * Activate your form at https://startbootstrap.com/solution/contact-forms * *-->
        <!-- * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *-->
        <script src="https://cdn.startbootstrap.com/sb-forms-latest.js"></script>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- 1. Import de SweetAlert2 -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <!-- 2. Script to detect Django messages and launch the popup -->
        {% if messages %}
            <script>
                // We create a global variable accessible by the external file.
                window.djangoMessages = [
                    {% for message in messages %}
                        {
                            "text": "{{ message|escapejs }}",
                            "tag": "{{ message.tags }}"
                        },
                    {% endfor %}
                ];
            </script>
        {% endif %}
        <script src="{% static 'authentication/js/message.js' %}"></script>
    </body>
</html>
