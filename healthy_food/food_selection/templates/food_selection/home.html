{% extends 'food_selection/base.html' %}
{% load static %}
{% block content %}
    {% include 'food_selection/header.html' %}
    <section class="page-section bg-white" id="services">
        <div class="container px-4 px-lg-5">
            <h2 class="text-center mt-0">Colette et Rémy</h2>
            <hr class="divider" />
            <div class="row gx-4 gx-lg-5 align-items-center justify-content-center text-center">
                <div class="col-lg-3 col-md-6 text-center">
                    <div class="mt-5">
                        <div class="mb-2"><i class="bi-gem fs-1 text-primary"></i></div>
                        <h3 class="h4 mb-2">Colette</h3>
                    </div>
                </div>
                <div class="col-lg-3 col-md-6 text-center">
                    <div class="mt-5">
                        <div class="mb-2"><i class="bi-laptop fs-1 text-primary"></i></div>
                        <h3 class="h4 mb-2">Rémy</h3>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Contact-->
    <section class="page-section bg-dark text-white">
        <div class="container px-4 px-lg-5 text-center">
            <h2 class="mb-4">Contactez nous !</h2>
            <p>Vous pouvez nous contacter par telephone ou par mail</p>
            <img src="{% static 'food_selection/images/telephone.png' %}" alt="phone icon"> 0123456789
            <img src="{% static 'food_selection/images/email.png' %}" alt="mail icon"> mon_mail@mail.com
        </div>
    </section>
{% endblock %}
