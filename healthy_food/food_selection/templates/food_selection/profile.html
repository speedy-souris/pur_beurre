{% extends 'food_selection/base.html' %}
{% load static %}
{% block content %}
    <!-- Structure of the logged-in user profile page -->
    <section class="container h-100 d-flex align-items-center justify-content-center text-center py-5">
        <div class="text-white p-5 rounded">
            <h2 class="mb-4">Profil Utilisateur</h2>
            <p class="fs-4"><strong>Pseudo :</strong> {{ user.username }}</p>
            <p class="fs-4"><strong>Email :</strong> {{ user.email }}</p>
            <div>
                <img src="{% static 'food_selection/images/image_product/default.jpg' %}"/>
                <img src="{% static 'food_selection/images/image_nutriscore/a.png' %}"/>
            </div>
        </div>
    </section>
{% endblock %}
